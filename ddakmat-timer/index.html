<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="딱맞춤 타이머">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>딱맞춤 타이머</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1f1d1a;--sub:#6f6a62;--line:#e8e3da;--accent:#e4572e;--accent-soft:#fdece6;--ok:#2f8f5b;--r:16px;--tabh:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px;line-height:1.45}
body{min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{max-width:520px;margin:0 auto;padding-bottom:calc(var(--tabh) + 120px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 10px 18px;background:linear-gradient(var(--bg) 82%,rgba(246,243,238,0))}
h1{font-size:20px;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
h1 i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--sub)}
.icon-btn:active{background:#ece7de}
main{padding:4px 16px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
h2{font-size:13px;font-weight:700;color:var(--sub);margin:0 0 10px}
.timebox{display:flex;align-items:flex-start;justify-content:center;gap:8px;margin:2px 0 14px}
.timebox label{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--sub)}
.timebox input{width:104px;font:700 52px/1.1 inherit;font-family:inherit;text-align:center;border:1px solid var(--line);border-radius:14px;background:#faf8f4;padding:8px 0;font-variant-numeric:tabular-nums;color:var(--ink)}
.timebox input:focus{outline:2px solid var(--accent);outline-offset:-1px;background:#fff}
.timebox b{font-size:44px;line-height:1.35;color:#b5aea3}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:999px;background:#f1ede5;font-size:14px;color:#3b3731}
.chip:active{background:#e6e0d4}
.chip.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.field{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#faf8f4;margin-bottom:10px;color:var(--ink)}
.field:focus{outline:2px solid var(--accent);outline-offset:-1px;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;background:#ece7de;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn:active{filter:brightness(.95)}
.btn.primary{background:var(--accent);color:#fff}
.btn.block{display:flex;width:100%}
.btn.danger{background:#fbe9e7;color:#b3261e}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.5}
#results{margin-top:16px}
.note{color:var(--sub);font-size:13.5px;margin:0 2px 10px}
.err{background:#fdeceb;color:#a2261d;border-radius:12px;padding:12px 14px;font-size:14px}
.song{display:flex;gap:12px;align-items:center;padding:10px;border:1.5px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px}
.song.sel{border-color:var(--accent);background:var(--accent-soft)}
.song img{width:104px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#e9e4da;flex:none}
.meta{min-width:0;flex:1}
.t{font-size:14.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tags span{font-size:11.5px;padding:2px 7px;border-radius:6px;background:#f1ede5;color:#4a453e;font-variant-numeric:tabular-nums}
.tags .ok{background:#e3f4ea;color:var(--ok);font-weight:600}
.tags .best{background:var(--accent);color:#fff}
.tags .heard{background:#e8eaf6;color:#3f4a9a}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #cfc8bb;flex:none}
.sel .radio{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px var(--accent-soft)}
.ibtn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:#b5aea3;flex:none}
.ibtn.on{color:var(--accent)}
.ibtn:active{background:#f1ede5}
.song.clickable{cursor:pointer}
.song.clickable:active{background:#faf6ef}
.ghead{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 8px}
.ghead b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ghead span{color:var(--sub);font-size:13px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 0}
.toolbar h3{margin:0;font-size:18px}
.empty{text-align:center;padding:56px 24px;color:var(--sub)}
.empty .big{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:8px}
.empty p{margin:0 0 18px;font-size:14.5px}
.ringwrap{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:12px auto 20px}
.ringwrap svg{width:100%;height:100%}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.cdsub{color:var(--sub);font-size:14px;margin-top:4px}
.runsong{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.runsong img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex:none;background:#e9e4da}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.row .field{margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.small{font-size:12.5px;color:var(--sub);margin:12px 2px 0}
#startbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 10px);padding:0 16px;z-index:6}
#startbar .btn{max-width:488px;margin:0 auto;box-shadow:0 6px 18px rgba(228,87,46,.35);padding:15px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabh)}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:#9a948a;position:relative}
#tabs button.on{color:var(--accent);font-weight:700}
#tabs .dot{position:absolute;top:10px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--accent)}
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet .backdrop{position:absolute;inset:0;background:rgba(20,18,14,.4)}
#sheet .panel{position:relative;width:100%;max-width:520px;max-height:90dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
#sheet h2{font-size:20px;color:var(--ink);margin:0 0 6px}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:16px 0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#ece7de;border-radius:12px;padding:3px}
.seg button{padding:10px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
details.help{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px}
details.help summary{font-weight:600;cursor:pointer}
details.help ol{margin:10px 0 4px;padding-left:20px}
details.help li{margin-bottom:6px}
.usage{font-size:12.5px;color:var(--sub);margin:14px 2px 0}
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:#2b2926;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><i></i>딱맞춤 타이머</h1>
    <button class="icon-btn" data-act="openSheet" aria-label="설정">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </header>
  <main id="view"></main>
</div>
<div id="startbar" hidden></div>
<nav id="tabs"><div class="in">
  <button data-act="tab" data-tab="timer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>타이머</button>
  <button data-act="tab" data-tab="run"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>재생 중<span class="dot" id="runDot" hidden></span></button>
  <button data-act="tab" data-tab="hist"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>기록</button>
</div></nav>
<div id="sheet" hidden></div>
<div id="toast"></div>

<script>
'use strict';
/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const pad = n => String(n).padStart(2, '0');
const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60; return h ? `${h}:${pad(m)}:${pad(r)}` : `${m}:${pad(r)}`; };
const parseDur = iso => { const m = /^P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(iso || ''); if (!m) return 0; return (+m[1] || 0) * 86400 + (+m[2] || 0) * 3600 + (+m[3] || 0) * 60 + (+m[4] || 0); };
const durClass = t => t < 210 ? 'short' : t <= 270 ? 'any' : t < 1140 ? 'medium' : t <= 1260 ? 'any' : 'long';
let toastTimer;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200); }

/* ---------- 상태 ---------- */
let settings = Object.assign({ app: 'youtube', offset: 0 }, load('dm_settings', {}));
let apiKey = load('dm_key', '');
let hist = load('dm_hist', []);     // [{id,title,channel,dur,ts,group,mood}]
let favs = load('dm_favs', {});     // {videoId:true}
let run = load('dm_run', null);     // 진행 중/끝난 타이머
const S = { tab: 'timer', min: 3, sec: 30, mood: '', items: [], next: null, sel: null, loading: false, msg: '', searched: false, fromCache: false, lastTarget: 0, onlyFav: false };

const MOODS = ['집중', '운동', '잔잔한 피아노', '로파이', 'K-pop', '재즈', '클래식', '감성 발라드'];
const PRESETS = [[60, '1분'], [180, '3분'], [300, '5분'], [600, '10분'], [1500, '25분']];

/* ---------- 유튜브 앱 열기 ---------- */
function ytUrl(id) {
  const music = settings.app === 'music';
  const host = music ? 'music.youtube.com' : 'www.youtube.com';
  const web = `https://${host}/watch?v=${id}`;
  if (/Android/i.test(navigator.userAgent)) {
    const pkg = music ? 'com.google.android.apps.youtube.music' : 'com.google.android.youtube';
    return `intent://${host}/watch?v=${id}#Intent;scheme=https;package=${pkg};S.browser_fallback_url=${encodeURIComponent(web)};end`;
  }
  return web;
}

/* ---------- API ---------- */
function usage() { const d = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' }); const u = load('dm_usage', {}); return u.date === d ? u.units : 0; }
function addUsage(n) { const d = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' }); const u = load('dm_usage', {}); save('dm_usage', { date: d, units: (u.date === d ? u.units : 0) + n }); }
async function yt(path, params) {
  const qs = new URLSearchParams(Object.assign({}, params, { key: apiKey }));
  let r;
  try { r = await fetch('https://www.googleapis.com/youtube/v3/' + path + '?' + qs); } catch (e) { throw { code: 'network' }; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = j.error || {}; throw { code: (e.errors && e.errors[0] && e.errors[0].reason) || e.status || r.status, message: e.message }; }
  return j;
}
function errMsg(err) {
  const quota = '오늘 검색 할당량을 다 썼어요. 한국 시간 오후 4~5시쯤 초기화돼요.';
  const m = {
    network: '인터넷 연결을 확인해 주세요.',
    keyInvalid: 'API 키가 올바르지 않아요. 설정에서 다시 확인해 주세요.',
    API_KEY_INVALID: 'API 키가 올바르지 않아요. 설정에서 다시 확인해 주세요.',
    quotaExceeded: quota, dailyLimitExceeded: quota, rateLimitExceeded: '요청이 너무 빨라요. 잠시 후 다시 시도해 주세요.',
    accessNotConfigured: 'YouTube Data API v3를 "사용 설정"해야 해요. 설정의 발급 방법을 확인해 주세요.',
    SERVICE_DISABLED: 'YouTube Data API v3를 "사용 설정"해야 해요. 설정의 발급 방법을 확인해 주세요.',
    ipRefererBlocked: 'API 키의 웹사이트 제한에 현재 주소가 빠져 있어요.',
    PERMISSION_DENIED: 'API 키 제한(웹사이트 주소, API 종류) 설정을 확인해 주세요.'
  };
  return m[err.code] || `오류가 발생했어요 (${err.code}${err.message ? ': ' + err.message : ''})`;
}

/* ---------- 검색 / 후보 고르기 ---------- */
function candidates() {
  const t = S.lastTarget, heard = new Set(hist.map(h => h.id));
  const all = S.items.filter(i => i.dur > 0).map(i => Object.assign({}, i, { diff: Math.abs(i.dur - t) }));
  let pool = [], tol = 30, near = false;
  for (const x of [10, 20, 30]) { pool = all.filter(i => i.diff <= x); tol = x; if (pool.length >= 3) break; }
  if (pool.length < 3) { pool = all.slice().sort((a, b) => a.diff - b.diff).slice(0, 5); near = true; }
  const minDiff = pool.length ? Math.min.apply(null, pool.map(i => i.diff)) : 0;
  pool.sort((a, b) => (a.diff + (heard.has(a.id) ? 10 : 0)) - (b.diff + (heard.has(b.id) ? 10 : 0)));
  return { list: pool.slice(0, 6), tol, near, total: all.length, minDiff, heard };
}
function pickDefault() { const c = candidates(); if (!c.list.some(i => i.id === S.sel)) S.sel = c.list[0] ? c.list[0].id : null; }

async function doSearch(more) {
  if (!apiKey) { toast('먼저 설정에서 API 키를 입력해 주세요'); openSheet(); return; }
  const target = S.min * 60 + S.sec;
  if (target < 10) { toast('타이머는 10초 이상으로 설정해 주세요'); return; }
  const mood = S.mood.trim();
  if (!mood) { toast('장르나 분위기를 입력해 주세요'); const f = $('#inMood'); if (f) f.focus(); return; }
  const cls = durClass(target), ck = mood.toLowerCase() + '|' + cls;
  const cache = load('dm_cache', {}); const ent = cache[ck];
  S.lastTarget = target; S.msg = '';
  if (!more && ent && Date.now() - ent.ts < 864e5) {
    S.items = ent.items; S.next = ent.next; S.fromCache = true; S.searched = true; S.loading = false;
    pickDefault(); renderResults(); return;
  }
  if (more && !(ent && ent.next)) { toast('더 가져올 결과가 없어요'); return; }
  S.loading = true; S.fromCache = false; renderResults();
  try {
    const p = { part: 'snippet', type: 'video', maxResults: 50, q: mood + ' audio', videoCategoryId: '10', regionCode: 'KR' };
    if (cls !== 'any') p.videoDuration = cls;
    if (more) p.pageToken = ent.next;
    const sr = await yt('search', p); addUsage(100);
    const ids = (sr.items || []).map(i => i.id && i.id.videoId).filter(Boolean);
    let fresh = [];
    if (ids.length) {
      const vr = await yt('videos', { part: 'snippet,contentDetails', id: ids.join(',') }); addUsage(1);
      fresh = (vr.items || []).map(v => ({ id: v.id, title: v.snippet.title, channel: v.snippet.channelTitle, dur: parseDur(v.contentDetails.duration) })).filter(v => v.dur > 0);
    }
    const base = more && ent ? ent.items : [], seen = new Set(base.map(i => i.id));
    const items = base.concat(fresh.filter(v => !seen.has(v.id)));
    cache[ck] = { ts: Date.now(), items, next: sr.nextPageToken || null };
    const keys = Object.keys(cache); if (keys.length > 30) keys.sort((a, b) => cache[a].ts - cache[b].ts).slice(0, keys.length - 30).forEach(k => delete cache[k]);
    save('dm_cache', cache);
    S.items = items; S.next = cache[ck].next; S.searched = true;
  } catch (err) { S.msg = errMsg(err); }
  S.loading = false; pickDefault(); renderResults();
}

/* ---------- 재생 시작 ---------- */
function startPlay(v, group, mood) {
  if (run && Date.now() < run.end && !confirm('진행 중인 타이머가 있어요. 새로 시작할까요?')) return;
  const now = Date.now();
  run = { id: v.id, title: v.title, channel: v.channel, dur: v.dur, start: now, end: now + (v.dur + (+settings.offset || 0)) * 1000, group, mood: mood || '', notified: false };
  save('dm_run', run);
  hist.unshift({ id: v.id, title: v.title, channel: v.channel, dur: v.dur, ts: now, group, mood: mood || '' });
  if (hist.length > 500) hist.length = 500;
  save('dm_hist', hist);
  S.tab = 'run'; render();
  window.location.href = ytUrl(v.id);
}

/* ---------- 화면: 타이머 ---------- */
function viewTimer() {
  return `
  <section class="card">
    <h2>타이머 길이</h2>
    <div class="timebox">
      <label><input id="inMin" inputmode="numeric" maxlength="3" value="${S.min}" aria-label="분">분</label>
      <b>:</b>
      <label><input id="inSec" inputmode="numeric" maxlength="2" value="${pad(S.sec)}" aria-label="초">초</label>
    </div>
    <div class="chips">${PRESETS.map(p => `<button class="chip" data-act="preset" data-sec="${p[0]}">${p[1]}</button>`).join('')}</div>
  </section>
  <section class="card">
    <h2>장르 · 분위기</h2>
    <input id="inMood" class="field" placeholder="예: 잔잔한 피아노" value="${esc(S.mood)}" enterkeyhint="search" autocomplete="off">
    <div class="chips">${MOODS.map(m => `<button class="chip ${S.mood === m ? 'on' : ''}" data-act="mood" data-v="${esc(m)}">${esc(m)}</button>`).join('')}</div>
  </section>
  <button class="btn primary block" data-act="search">곡 찾기</button>
  <div id="results"></div>`;
}
function songCard(v, c) {
  const heard = c.heard.has(v.id);
  return `<div class="song clickable ${S.sel === v.id ? 'sel' : ''}" data-act="pick" data-id="${v.id}">
    <img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="">
    <div class="meta"><div class="t">${esc(v.title)}</div><div class="s">${esc(v.channel)}</div>
      <div class="tags"><span>${fmt(v.dur)}</span><span class="${v.diff === 0 ? 'ok' : ''}">${v.diff === 0 ? '정확히 일치' : v.diff + '초 차이'}</span>${v.diff === c.minDiff ? '<span class="best">가장 가까워요</span>' : ''}${heard ? '<span class="heard">들었던 곡</span>' : ''}</div>
    </div><span class="radio"></span></div>`;
}
function renderResults() {
  const el = $('#results'); if (!el) return;
  let h = '';
  if (S.loading) h = '<p class="note">곡을 찾는 중이에요…</p>';
  else if (S.msg) h = `<div class="err">${esc(S.msg)}</div>`;
  else if (S.searched) {
    const c = candidates();
    if (!c.total) h = '<p class="note">길이를 확인할 수 있는 곡이 없어요. 다른 분위기로 검색해 보세요.</p>';
    else {
      h += `<p class="note">${c.near ? `±30초 안에 곡이 적어서 가장 가까운 곡을 보여드려요.` : `${fmt(S.lastTarget)} 기준 ±${c.tol}초 이내 곡이에요.`} (검색된 영상 ${c.total}개${S.fromCache ? ', 저장된 결과 사용' : ''})</p>`;
      h += c.list.map(v => songCard(v, c)).join('');
      h += `<div class="row" style="margin-top:6px">${S.next ? '<button class="btn ghost" data-act="more" style="flex:1">더 찾아보기</button>' : ''}</div>`;
      h += '<p class="small">곡 길이만큼 타이머가 설정돼요. 광고로 곡이 늦게 시작되면 재생 중 화면에서 +5초로 보정하세요.</p>';
    }
  }
  el.innerHTML = h; updateStart();
}
function updateStart() {
  const bar = $('#startbar'); const v = S.sel && S.items.find(i => i.id === S.sel);
  if (S.tab === 'timer' && v && !S.loading && !S.msg && S.searched) {
    bar.hidden = false;
    bar.innerHTML = `<button class="btn primary block" data-act="start">이 곡으로 시작 · ${fmt(v.dur)}</button>`;
  } else bar.hidden = true;
}

/* ---------- 화면: 재생 중 ---------- */
const RING = 2 * Math.PI * 88;
function viewRun() {
  if (!run) return `<div class="empty"><div class="big">진행 중인 타이머가 없어요</div><p>타이머 탭에서 곡을 골라 시작하거나,<br>기록에서 곡을 눌러 다시 재생해 보세요.</p><button class="btn primary" data-act="tab" data-tab="timer">타이머 만들기</button></div>`;
  const now = Date.now(), done = now >= run.end;
  const total = Math.max(1, (run.end - run.start) / 1000), p = done ? 1 : Math.min(1, (now - run.start) / 1000 / total);
  const appName = settings.app === 'music' ? '유튜브 뮤직' : '유튜브';
  const song = `<div class="runsong"><img src="https://i.ytimg.com/vi/${run.id}/mqdefault.jpg" alt=""><div class="meta"><div class="t">${esc(run.title)}</div><div class="s">${esc(run.channel)} · ${fmt(run.dur)}</div></div></div>`;
  const ring = `<div class="ringwrap"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="#e8e3da" stroke-width="10"/><circle id="ringFg" cx="100" cy="100" r="88" fill="none" stroke="${done ? '#2f8f5b' : '#e4572e'}" stroke-width="10" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="${RING}" stroke-dashoffset="${RING * p}"/></svg>
    <div class="ringc"><div class="cd" id="cd">${done ? '끝!' : fmt(Math.ceil((run.end - now) / 1000))}</div><div class="cdsub" id="cdsub">${done ? '타이머가 끝났어요' : '남은 시간'}</div></div></div>`;
  if (done) return ring + `<section class="card">${song}
    <button class="btn primary block" data-act="again">같은 곡 다시 재생</button>
    <div class="grid2" style="grid-template-columns:1fr 1fr"><button class="btn" data-act="tab" data-tab="hist">기록 보기</button><button class="btn" data-act="clearRun">새 타이머</button></div></section>`;
  return ring + `<section class="card">${song}
    <a class="btn primary block" href="${esc(ytUrl(run.id))}">${appName}에서 다시 열기</a>
    <div class="grid2"><button class="btn" data-act="adj" data-d="-5">−5초</button><button class="btn" data-act="adj" data-d="5">+5초</button><button class="btn danger" data-act="stop">중지</button></div>
    <p class="small">타이머는 곡 길이(${fmt(run.dur)})에 맞춰져 있어요. 광고 때문에 곡이 늦게 시작되면 +5초로 맞춰 주세요.</p></section>`;
}
function tick() {
  if (!run) return;
  const now = Date.now();
  if (now >= run.end) {
    if (!run.notified) {
      run.notified = true; save('dm_run', run);
      if (!document.hidden) { try { navigator.vibrate && navigator.vibrate([250, 120, 250]); } catch (e) {} }
      if (S.tab === 'run') render(); updateBadge();
    }
    return;
  }
  if (S.tab === 'run') {
    const cd = $('#cd'), fg = $('#ringFg'); if (!cd || !fg) return;
    cd.textContent = fmt(Math.ceil((run.end - now) / 1000));
    const total = Math.max(1, (run.end - run.start) / 1000);
    fg.setAttribute('stroke-dashoffset', RING * Math.min(1, (now - run.start) / 1000 / total));
  }
}
function updateBadge() { $('#runDot').hidden = !(run && Date.now() < run.end); }

/* ---------- 화면: 기록 ---------- */
const heart = on => `<svg width="22" height="22" viewBox="0 0 24 24" fill="${on ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
const trash = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
function viewHist() {
  const groups = new Map();
  for (const h of hist) {
    if (S.onlyFav && !favs[h.id]) continue;
    if (!groups.has(h.group)) groups.set(h.group, new Map());
    const g = groups.get(h.group), e = g.get(h.id);
    if (e) e.n++; else g.set(h.id, { n: 1, last: h });
  }
  let h = `<div class="toolbar"><h3>재생 기록</h3><button class="chip ${S.onlyFav ? 'on' : ''}" data-act="onlyFav">♥ 즐겨찾기만</button></div>`;
  if (!groups.size) return h + `<div class="empty"><div class="big">${S.onlyFav ? '즐겨찾기한 곡이 없어요' : '아직 기록이 없어요'}</div><p>${S.onlyFav ? '기록에서 하트를 눌러 곡을 모아보세요.' : '타이머로 곡을 재생하면 여기에 쌓여요.'}</p></div>`;
  for (const key of Array.from(groups.keys()).sort((a, b) => a - b)) {
    const g = groups.get(key);
    h += `<div class="ghead"><b>${fmt(key)} 타이머</b><span>곡 ${g.size}개</span></div>`;
    for (const [id, e] of g) {
      const v = e.last, d = new Date(v.ts);
      h += `<div class="song clickable" data-act="replay" data-id="${id}" data-g="${key}">
        <img loading="lazy" src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt="">
        <div class="meta"><div class="t">${esc(v.title)}</div><div class="s">${esc(v.channel)}</div>
        <div class="tags"><span>${fmt(v.dur)}</span><span>${e.n}회 · ${d.getMonth() + 1}/${d.getDate()}</span>${v.mood ? `<span>${esc(v.mood)}</span>` : ''}</div></div>
        <button class="ibtn ${favs[id] ? 'on' : ''}" data-act="fav" data-id="${id}" aria-label="즐겨찾기">${heart(!!favs[id])}</button>
        <button class="ibtn" data-act="del" data-id="${id}" data-g="${key}" aria-label="삭제">${trash}</button></div>`;
    }
  }
  return h + '<p class="small">곡을 누르면 그 곡 길이로 타이머가 맞춰지고, 바로 재생돼요.</p>';
}

/* ---------- 설정 ---------- */
function openSheet() {
  $('#sheet').innerHTML = `<div class="backdrop" data-act="closeSheet"></div><div class="panel">
    <h2>설정</h2>
    <label class="lbl">YouTube API 키</label>
    <div class="row"><input id="inKey" class="field" type="password" autocomplete="off" placeholder="AIza..." value="${esc(apiKey)}"><button class="btn" data-act="saveKey">저장</button></div>
    <details class="help"><summary>API 키 발급 방법 (무료)</summary><ol>
      <li><b>console.cloud.google.com</b> 에 구글 계정으로 접속해 새 프로젝트를 만들어요.</li>
      <li>"API 및 서비스 → 라이브러리"에서 <b>YouTube Data API v3</b>를 검색해 "사용"을 눌러요.</li>
      <li>"사용자 인증 정보 → 사용자 인증 정보 만들기 → API 키"로 키를 만들어요.</li>
      <li>만든 키를 눌러 "애플리케이션 제한사항"을 <b>웹사이트</b>로, 이 앱 주소(예: https://내아이디.github.io/*)를 추가하고, "API 제한사항"은 <b>YouTube Data API v3</b>만 선택해요.</li>
      <li>키는 이 폰 안에만 저장되고 앱 코드에는 들어가지 않아요.</li></ol></details>
    <label class="lbl">곡을 열 앱</label>
    <div class="seg"><button data-act="setApp" data-v="youtube" class="${settings.app === 'youtube' ? 'on' : ''}">YouTube</button><button data-act="setApp" data-v="music" class="${settings.app === 'music' ? 'on' : ''}">YouTube Music</button></div>
    <label class="lbl">시작 지연 보정 (초)</label>
    <div class="row"><input id="inOffset" class="field" inputmode="numeric" style="width:90px" value="${+settings.offset || 0}"><span class="small" style="margin:0">광고 등으로 곡이 늦게 시작될 때를 대비해 타이머에 더해요.</span></div>
    <div class="usage">오늘 검색 사용량(이 기기 기준) 약 ${usage().toLocaleString()} / 10,000</div>
    <label class="lbl">데이터</label>
    <div class="row wrap"><button class="btn" data-act="export">기록 내보내기</button><button class="btn" data-act="import">기록 가져오기</button><input id="fileIn" type="file" accept="application/json,.json" hidden></div>
    <div class="row wrap" style="margin-top:8px"><button class="btn ghost" data-act="clearCache">검색 결과 캐시 삭제</button><button class="btn danger" data-act="clearHist">기록 전체 삭제</button></div>
    <button class="btn primary block" style="margin-top:18px" data-act="closeSheet">닫기</button></div>`;
  $('#sheet').hidden = false;
}
async function exportData() {
  const data = JSON.stringify({ app: 'ddakmat-timer', version: 1, exported: new Date().toISOString(), history: hist, favs }, null, 1);
  const name = `ddakmat-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([data], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importFile(f) {
  try {
    const j = JSON.parse(await f.text()); if (!Array.isArray(j.history)) throw 0;
    const key = h => h.id + '_' + h.ts, have = new Set(hist.map(key)); let n = 0;
    for (const h of j.history) if (h && h.id && h.ts && !have.has(key(h))) { hist.push(h); n++; }
    hist.sort((a, b) => b.ts - a.ts); Object.assign(favs, j.favs || {});
    save('dm_hist', hist); save('dm_favs', favs); toast(`기록 ${n}건을 가져왔어요`); render();
  } catch (e) { toast('가져올 수 없는 파일이에요'); }
}

/* ---------- 렌더 / 이벤트 ---------- */
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  $('#view').innerHTML = S.tab === 'timer' ? viewTimer() : S.tab === 'run' ? viewRun() : viewHist();
  if (S.tab === 'timer') renderResults();
  updateStart(); updateBadge();
}
const H = {
  tab: b => { S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); },
  preset: b => { const s = +b.dataset.sec; S.min = Math.floor(s / 60); S.sec = s % 60; $('#inMin').value = S.min; $('#inSec').value = pad(S.sec); },
  mood: b => { S.mood = b.dataset.v; $('#inMood').value = S.mood; document.querySelectorAll('[data-act="mood"]').forEach(c => c.classList.toggle('on', c.dataset.v === S.mood)); },
  search: () => doSearch(false),
  more: () => doSearch(true),
  pick: b => { S.sel = b.dataset.id; renderResults(); },
  start: () => { const v = S.items.find(i => i.id === S.sel); if (v) startPlay(v, S.lastTarget, S.mood.trim()); },
  replay: b => {
    const id = b.dataset.id, g = +b.dataset.g, e = hist.find(h => h.id === id && h.group === g); if (!e) return;
    startPlay({ id, title: e.title, channel: e.channel, dur: e.dur }, g, e.mood);
  },
  again: () => { if (run) startPlay({ id: run.id, title: run.title, channel: run.channel, dur: run.dur }, run.group, run.mood); },
  fav: b => { const id = b.dataset.id; if (favs[id]) delete favs[id]; else favs[id] = true; save('dm_favs', favs); render(); },
  del: b => { if (!confirm('이 곡을 기록에서 지울까요?')) return; const id = b.dataset.id, g = +b.dataset.g; hist = hist.filter(h => !(h.id === id && h.group === g)); save('dm_hist', hist); render(); },
  onlyFav: () => { S.onlyFav = !S.onlyFav; render(); },
  adj: b => { if (!run) return; run.end = Math.max(Date.now() + 1000, run.end + (+b.dataset.d) * 1000); save('dm_run', run); render(); },
  stop: () => { if (confirm('타이머를 중지할까요?')) { run = null; save('dm_run', null); render(); } },
  clearRun: () => { run = null; save('dm_run', null); S.tab = 'timer'; render(); },
  openSheet: () => openSheet(),
  closeSheet: () => { $('#sheet').hidden = true; },
  saveKey: () => { apiKey = $('#inKey').value.trim(); save('dm_key', apiKey); toast(apiKey ? 'API 키를 저장했어요' : 'API 키를 지웠어요'); },
  setApp: b => { settings.app = b.dataset.v; save('dm_settings', settings); document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b)); },
  export: () => exportData(),
  import: () => $('#fileIn').click(),
  clearCache: () => { save('dm_cache', {}); toast('캐시를 삭제했어요'); },
  clearHist: () => { if (confirm('기록과 즐겨찾기를 모두 삭제할까요? 되돌릴 수 없어요.')) { hist = []; favs = {}; save('dm_hist', hist); save('dm_favs', favs); toast('삭제했어요'); render(); } }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && H[b.dataset.act]) H[b.dataset.act](b, e); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'inMin' || t.id === 'inSec') { t.value = t.value.replace(/\D/g, ''); if (t.id === 'inMin') S.min = Math.min(180, +t.value || 0); else S.sec = Math.min(59, +t.value || 0); }
  else if (t.id === 'inMood') { S.mood = t.value; document.querySelectorAll('[data-act="mood"]').forEach(c => c.classList.toggle('on', c.dataset.v === S.mood)); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'inMin') { t.value = S.min; }
  else if (t.id === 'inSec') { t.value = pad(S.sec); }
  else if (t.id === 'inOffset') { settings.offset = Math.max(0, Math.min(60, +t.value || 0)); t.value = settings.offset; save('dm_settings', settings); }
  else if (t.id === 'fileIn' && t.files[0]) { importFile(t.files[0]); t.value = ''; }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'inMood') { e.preventDefault(); e.target.blur(); doSearch(false); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); if (S.tab === 'run') render(); updateBadge(); } });

/* ---------- 시작 ---------- */
if (run && Date.now() < run.end) S.tab = 'run';
render();
setInterval(tick, 250);
if (!apiKey) openSheet();
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
